<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="x-apple-disable-message-reformatting">
<title>{{subject}}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; }
table { border-collapse: collapse; }
@media (max-width: 639px) {
  .wrapper { width: 100% !important; border-radius: 0 !important; border-left: 0 !important; border-right: 0 !important; }
  .row { padding-left: 20px !important; padding-right: 20px !important; }
}
</style>
</head>
<body style="margin:0;padding:0;background:#f6f6f6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f6f6;">
<tr><td align="center" style="padding:20px 8px;">
<table role="presentation" class="wrapper" width="640" cellpadding="0" cellspacing="0" style="width:100%;max-width:640px;background:#ffffff;border-radius:30px;border-collapse:separate;overflow:hidden;">
<tr><td class="row" style="padding:48px 50px 16px;font-family:'Inter',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.65;color:#515856;">
{{content}}
</td></tr>
<tr><td class="row" style="padding:48px 50px 0;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="border-top:1px solid #000000;font-size:0;line-height:0;">&nbsp;</td></tr></table></td></tr>
<tr><td class="row" style="padding:24px 50px 0;font-family:'Inter',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.65;color:#7f8c8d;">- Rafal from Gistly -</td></tr>
<tr><td class="row" style="padding:24px 50px 40px;">
<table role="presentation" cellpadding="0" cellspacing="0"><tr>

<td width="24"></td>
<td valign="middle" style="font-family:'Inter',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.65;color:#515856;">Hi, I am Rafal - the solo maker of Gistly.<br>I created it to help people like you make the most of their time spent on YouTube. Hope you'll find Gistly useful!</td>
</tr></table>
</td></tr>
</table>
<table role="presentation" width="640" cellpadding="0" cellspacing="0" style="width:100%;max-width:640px;">
<tr><td class="row" style="padding:24px 50px 32px;font-family:'Inter',Helvetica,Arial,sans-serif;">{{footer}}</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
