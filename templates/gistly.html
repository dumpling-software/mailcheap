<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="x-apple-disable-message-reformatting">
<title>{{subject}}</title>
<style>
body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; }
table { border-collapse: collapse; }
@media (max-width: 639px) {
  .wrapper { width: 100% !important; border-radius: 0 !important; border-left: 0 !important; border-right: 0 !important; }
  .row { padding-left: 20px !important; padding-right: 20px !important; }
}
</style>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff;">
<tr><td align="center" style="padding:20px 8px;">
<table role="presentation" class="wrapper" width="640" cellpadding="0" cellspacing="0" style="width:100%;max-width:640px;background:#ffffff;">
<tr><td class="row" style="padding:16px 20px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.65;color:#000000;">
{{content}}
</td></tr>
</table>
<table role="presentation" width="640" cellpadding="0" cellspacing="0" style="width:100%;max-width:640px;">
<tr><td class="row" style="padding:24px 20px 32px;font-family:Arial,Helvetica,sans-serif;">{{footer}}</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
